<aside class="analytics-consent" id="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <h2 id="analytics-consent-title">Help improve this portfolio</h2>
  <p>Allow Microsoft Clarity to record clicks, scrolling, and page interactions so I can understand which work interests visitors. It uses analytics cookies; form inputs are masked. <a href="{{ '/privacy/' | relative_url }}">Privacy details</a></p>
  <div class="analytics-consent-actions">
    <button type="button" class="analytics-choice" data-analytics-choice="granted">Accept analytics</button>
    <button type="button" class="analytics-choice" data-analytics-choice="denied">Decline analytics</button>
  </div>
</aside>
<div class="analytics-settings" id="analytics-settings" hidden>
  <button type="button" id="analytics-settings-button" aria-controls="analytics-consent" aria-expanded="false">Analytics preferences</button>
</div>
