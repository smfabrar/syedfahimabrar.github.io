{% assign skills = site.data.data.skills %} {% if skills %}
<section class="section skill-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-wrench fa-stack-1x fa-inverse"></i>
    </span>
    {{ skills.title }}
  </h2>

  <div class="skill-groups">
    {% for skill in skills.toolset %}
    <div class="skill-group">
      <h3 class="skill-group-title"><i class="{{ skill.icon }}" aria-hidden="true"></i>{{ skill.type }}</h3>
      <ul class="skill-list">
        {% for subSkill in skill.list %}
        <li>{{ subSkill.name }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>

</section>
<!--//skills-section-->
{% endif %}
