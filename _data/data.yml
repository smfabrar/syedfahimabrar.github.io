    summary: |
      AI engineer with several years of software engineering experience across generative AI, healthcare platforms, microservices, and cloud systems. Combines hands-on AI development with a strong foundation in Python, .NET, and distributed software architecture. Currently pursuing an MSc in AI & Language at Stockholm University and seeking Research Engineer, AI Engineer, or AI Software Engineer opportunities.
