experiences:
    title: Experiences
    info:
      - role: Research Assistant
        time: May 2026 – Aug. 2026
        company: KTH Royal Institute of Technology, Stockholm, SE
        link: https://www.kth.se/en
        details: |
            - Developed [Hear-Me-Out](https://github.com/shreeharsha-bs/Hear-Me-Out), a research platform for controlled studies comparing conversational AI responses to natural and converted voices.
            - Built React/TypeScript participant and researcher interfaces with FastAPI services for study configuration, counterbalanced assignments, and questionnaires.
            - Engineered an Opus-over-WebSocket audio pipeline integrating NVIDIA PersonaPlex with MeanVC/X-VC for real-time voice conversion, plus Seed-VC for offline conversion.
            - Implemented server-controlled voice switching and captured original and converted audio, transcripts, and session events for WER, speaker similarity, and UTMOS analysis.
            - Migrated speech inference to local GPUs and deployed the services with Docker, isolated Python environments, and HTTPS/WSS.
      - role: Senior Software Engineer
        time: Jan. 2025 – Aug. 2025
        company: Cefalo AS, Dhaka, BD
        link: https://cefalo.com
        details: |
            - Led generative AI projects using Llama.cpp, LlamaIndex, Whisper, OpenAI, and Mistral.
            - Built an AI-assisted mainframe code modernization platform for code generation, testing, documentation, dependency graphs, and migration plans.
            - Developed a multi-tenant Blazor clinic portal and continued .NET WPF kiosk applications for appointments, check-in, and payments; added FlaUI regression tests.
            - Built Python microservices, Dockerized code-execution sandboxes, and distributed processing with Celery and Redis.
            - Designed a graph architecture for code dependencies and stored transformation artifacts in MinIO; built a FastAPI/SSE monitoring dashboard with Grafana and Langfuse tracing.
      - role: Software Engineer
        time: Jul. 2022 – Dec. 2024
        company: Cefalo AS, Dhaka, BD
        link: https://cefalo.com
        details: |
            - Designed event-driven microservices using Azure Functions and Service Bus, with Redis Cache and Azure Blob Storage.
            - Integrated Cambio Cosmic, DIPS, Semble, and Dentally EHR systems with appointment and payment features; developed related WPF desktop applications.
            - Built .NET Core and PostgreSQL healthcare services, including payment, invoicing, and debt-collection workflows.
            - Managed API access through Azure API Management and CI/CD pipelines through Azure DevOps.
            - Built data systems with Cosmos DB, MSSQL, and Entity Framework, and maintained technical documentation.
      - role: Software Engineer
        time: Jan. 2022 – Jun. 2022
        company: Brainstation23 Ltd, Dhaka, BD
        link: https://brainstation-23.com/
        details: |
            - Worked closely with Project Managers and other developers to define parameters and plan detailed specifications with clear project deliverables and timelines to meet strict deadlines.
            - Developed back-end Web services in ASP.NET core with microservices architectures.
            - Developed reactive web application with Rx.NET and Blazor
            - Worked with the latest cutting-edge technologies like Docker,Kubernetes,GitHub-Actions etc
      - role: Associate Software Engineer II
        time: Nov. 2020 - Dec. 2021
        company: Brainstation23 Ltd, Dhaka, BD
        link: https://brainstation-23.com/
        details: |
            - Designed client-side code with Angular, Rxjs, specifically known as reactive web app
            - Collaborated in integrating diverse stack web UI applications featuring web components from React, Angular
              etc.
            - Implemented real-time communication and data transmission through SignalR and server-sent events.
      - role: Junior Software Engineer
        time: Nov. 2019 – Jun 2020
        company: Dynamic Solvers Bangladesh Ltd,Dhaka,BD
        link: https://www.linkedin.com/company/dynamic-solvers-bangladesh/
        details: |
            - Developed high-performance API with .Net Core
            - Developed Windows and Linux worker services
            - Contributed to a map based mobile application in the Flutter
            - Introduced and implemented a successful DevOps pipeline for the first time, resulting in a significant reduction in
              deployment failures, bugs, and overall deployment time.


